[package]
name = "terra_build"
description = "Construction: walls, floors and roofs on a grid, and the rooms they close in."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam.workspace = true
serde.workspace = true
libm.workspace = true
# A kit's dressed pieces are RON (`kit::Dressing::read`), as the kits are; and saves are
# RON (the game's save file), which tests read as they were written.
ron.workspace = true
# The hash mixers every crate shares (terra_gen::hash), and seeded random streams for the
# property tests over random operations.
terra_gen.workspace = true
# The contracts building shares with the world: a walker's size and the start's plot
# (D407).
terra_core.workspace = true

[dev-dependencies]
# The material bench reads a material's maps (`examples/look.rs`, D385), and writes its
# numbers for its TypeScript side.
zune-jpeg.workspace = true
zune-core.workspace = true
serde_json = "1"

[lints]
workspace = true
