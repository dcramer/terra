[package]
name = "terra_build"
description = "Construction: walls, floors and roofs on a grid, and the rooms they close in."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam.workspace = true
serde.workspace = true
libm.workspace = true
# A kit's dressed pieces are RON (`kit::Dressing::read`), as the kits are; and saves are
# RON (the game's save file), which tests read as they were written.
ron.workspace = true

[dev-dependencies]
# Seeded random streams for the property tests over random operations.
terra_gen.workspace = true
# The kit checker reads a material's maps to check them as it is added (`packs`, D349).
zune-jpeg.workspace = true
zune-core.workspace = true

[lints]
workspace = true
