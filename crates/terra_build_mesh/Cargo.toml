[package]
name = "terra_build_mesh"
description = "Building drawn: a base's laid pieces made into surfaces by material, in sections at each detail, dressed, worn and broken into fragments; and the kit checker, the packs' checks and the mesh inspector over them. No engine dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam.workspace = true
libm.workspace = true
# The hash mixers every crate shares (terra_gen::hash), and the sweeps over every core
# (terra_gen::par, D406).
terra_gen.workspace = true
# The rules and the layout this draws (D407).
terra_build.workspace = true

[dev-dependencies]
# The kit checker reads a material's maps to check them as it is added (`packs`, D349).
zune-jpeg.workspace = true
zune-core.workspace = true
# The tests and the kit checker read kits, items and textures as RON.
ron.workspace = true
serde.workspace = true

[lints]
workspace = true
