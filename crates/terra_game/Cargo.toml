[package]
name = "terra_game"
description = "The game in Bevy: the app over the gameplay crates (D407): the map, the game's sounds and music, saving, the remote probe, and the plugin groups every run is built from."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `bevy_remote`: the remote protocol, so a script can drive a running build (`--remote`).
bevy = { workspace = true, features = ["bevy_remote"] }
libm.workspace = true
ron.workspace = true
serde.workspace = true
# Remote methods take and give JSON; already built for Bevy's remote protocol.
serde_json = "1"
# The base on screen (D407), re-exported as `build`.
terra_bases.workspace = true
terra_build.workspace = true
# Building play (D407), re-exported at its old paths.
terra_building.workspace = true
terra_core.workspace = true
# Creatures and fighting (D407), re-exported at their old paths.
terra_creatures.workspace = true
# Townsfolk (D407), re-exported at their old paths.
terra_folk.workspace = true
terra_gen.workspace = true
terra_items.workspace = true
# What a player carries, makes and needs (D407), re-exported at its old paths.
terra_survival.workspace = true
# The walker layer (D198, D407), re-exported at its old paths.
terra_walker.workspace = true
terra_world.workspace = true

[dev-dependencies]
# The test world.
terra_survival = { workspace = true, features = ["testing"] }
# Measuring the game's sounds and music.
terra_world = { workspace = true, features = ["testing"] }

[lints]
workspace = true
