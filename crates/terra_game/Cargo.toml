[package]
name = "terra_game"
description = "The game in Bevy: the world on screen, the player, what they carry and build, creatures, people, sound, saving, and the harness every build runs under."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `bevy_remote`: the remote protocol, so a script can drive a running build (`--remote`).
bevy = { workspace = true, features = ["bevy_remote"] }
bevy-inspector-egui.workspace = true
libm.workspace = true
ron.workspace = true
serde.workspace = true
# Remote methods take and give JSON; already built for Bevy's remote protocol.
serde_json = "1"
# The version Bevy itself reads models with, used here to read model shapes directly.
gltf = { version = "1.4", default-features = false, features = ["utils"] }
terra_build.workspace = true
# Building drawn: the sections, their meshes and fragments the game uploads (D407).
terra_build_mesh.workspace = true
# The kit sheet's rows the build sheet lays (terra_build_scenes::sheet, D407).
terra_build_scenes.workspace = true
terra_climate.workspace = true
terra_core.workspace = true
terra_gen.workspace = true
terra_items.workspace = true
# Settlements: a town laid out and its people's days (D324).
terra_town.workspace = true
terra_voxel.workspace = true
terra_world.workspace = true

[dev-dependencies]
# The WESL compiler and shader validator Bevy builds its shaders with, at Bevy's versions:
# the skinning shader is compiled and validated in a test, without a GPU.
naga = { version = "30", features = ["wgsl-in"] }
terra_world = { workspace = true, features = ["testing"] }
wesl = { version = "0.6", features = ["naga-ext"] }

[lints]
workspace = true
