[package]
name = "terra_walker"
description = "The walker layer in Bevy (D198, D407): a body this machine steers over the world, its camera, controls, options and figure, and the character's look (appearance, skinning, lift, swing, pace)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
libm.workspace = true
serde.workspace = true
# The character's data files (templates, colliders, skinning) are JSON.
serde_json = "1"
# The base on screen: a walker stands on it and steps off it (D407).
terra_bases.workspace = true
terra_build.workspace = true
# Building laid out: the walking over a base.
terra_build_layout.workspace = true
terra_core.workspace = true
# The character controller (D53): the world's sources in its shapes (`mover_world`).
terra_motion.workspace = true
terra_world.workspace = true

[dev-dependencies]
# cost.crowd's bench times the bodies' tick on a rayon pool (the server's, D53) beside Bevy's.
rayon = "1"
# The controller course's fixtures (D53), which the mover's bench walks (`cargo xtask controller --bench`).
terra_motion = { workspace = true, features = ["course"] }
# The WESL compiler and shader validator Bevy builds its shaders with, at Bevy's versions:
# the skinning shader is compiled and validated in a test, without a GPU.
naga = { version = "30", features = ["wgsl-in"] }
wesl = { version = "0.6", features = ["naga-ext"] }

[features]
# `model_files`, for the tests of the crates above that check the data naming a model's
# joints, sockets and morphs.
testing = []

[lints]
workspace = true
