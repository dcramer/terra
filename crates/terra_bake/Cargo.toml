[package]
name = "terra_bake"
description = "The texture bake (D188): models', materials' and the fire's pictures cooked into BC7, BC5 and BC4 KTX2 with mipmaps, `cargo xtask cook`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ctt.workspace = true
image.workspace = true
terra_core.workspace = true
# Already built for ctt's encoders; cooks the files side by side.
rayon = "1"
serde_json = "1"

[dev-dependencies]
# Reads back what the bake wrote: the version ctt writes with.
ktx2 = "0.5"

[lints]
workspace = true
