[package]
name = "terra_items"
description = "Items and containers: kinds, the backpack grid, equipment and the action bar. No engine dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The assembler reads the kinds and parts as JSON (assets/data/kinds, assets/data/parts; D566)
# and writes its canonical bytes; both already built for the workspace.
serde.workspace = true
serde_json = "1"
# A seated trim's turn (a boss, a rim) as a quaternion from its full points' frames.
glam.workspace = true

[dev-dependencies]
terra_gen.workspace = true

[lints]
workspace = true
