[package]
name = "terra_sandbox"
description = "A test environment for the game: a window, a stand-in planet, a free camera, live tweaks, testbeds and developer tools to switch on."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
libm.workspace = true
serde.workspace = true
serde_json = "1"
# The global allocator (D340): MIT, Microsoft's, kept current, no Bevy dependency; see main.rs.
mimalloc = "0.1.52"
# The controller's filmed course: its base's cubes and its ground's material (experiments/course_yard).
terra_build.workspace = true
terra_climate.workspace = true
terra_core.workspace = true
terra_creatures.workspace = true
# The dungeon demos: a generated dungeon laid in building cubes (experiments/dungeon).
terra_dungeon.workspace = true
terra_game.workspace = true
terra_gen.workspace = true
# The dungeon demos light fires as the game's campfires burn (props::CAMPFIRE).
terra_survival.workspace = true
terra_voxel.workspace = true
terra_walker.workspace = true
terra_world.workspace = true

[features]
# The frame recorder's freeze lines (terra_world's `hitch-log`, D576).
hitch-log = ["terra_world/hitch-log"]
# Bevy keeps the line of code behind every spawn and component change, for the remote's
# `sandbox.why` (`r why`, D548). On in every dev build of the sandbox (xtask, the remote's
# `start` and the seed pass it), never in a release or bench build, which are timed.
track_location = ["bevy/track_location"]

[lints]
workspace = true
