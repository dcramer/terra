[package]
name = "terra_world"
description = "The world on screen in Bevy: the shell every run starts in, the planet, terrain, sky and the start, and the world layer (D198): light, the day, what grows, the tick and levels of detail."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The gate on Bevy's glTF loader (gltf_gate.rs); already built for Bevy's asset server.
async-lock = "3"
# `bevy_remote`: the remote protocol, so a script can drive a running build (`--remote`).
bevy = { workspace = true, features = ["bevy_remote"] }
bevy-inspector-egui.workspace = true
libm.workspace = true
ron.workspace = true
serde.workspace = true
# Remote methods take and give JSON; already built for Bevy's remote protocol.
serde_json = "1"
# The version Bevy itself reads models with, used here to read model shapes directly.
gltf = { version = "1.4", default-features = false, features = ["utils"] }
# Half floats for the sky light's diffuse map, filled on the CPU (skylight.rs, D492); already
# built for Bevy's images.
half = "2"
terra_climate.workspace = true
terra_core.workspace = true
terra_gen.workspace = true
terra_land.workspace = true
terra_voxel.workspace = true

# macOS's App Nap throttles a run whose window is hidden, as scripted runs' are; the run
# asks it not to (shell::stay_awake). Already built for Bevy's windowing (winit).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[dev-dependencies]
# wgpu's stub device, to build materials' layouts without a card (samplers_tests.rs); the
# version Bevy draws with, its `noop` feature as Bevy's own tests use it.
wgpu = { version = "30", default-features = false, features = ["noop"] }
# The shader validator wgpu runs before a driver sees a shader, at Bevy's version: every
# shader is compiled by Bevy's shader cache and validated in a test, without a GPU
# (shaders_tests.rs, D549).
naga = { version = "30", features = ["wgsl-in"] }

[features]
# Helpers for the tests of the crates above, such as measuring how loud a sound is.
testing = []
# Bevy's spans compiled in, so the frame recorder (recorder.rs, D576) says what ran long in a
# freeze. Not in every build: compiled in, it cost the `world` scene 9.7 to 11.5 ms a frame.
hitch-log = ["bevy/trace"]

[lints]
workspace = true
