[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Throwaway spikes keep their own manifests.
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
terra_build = { path = "crates/terra_build" }
terra_build_scenes = { path = "crates/terra_build_scenes" }
terra_climate = { path = "crates/terra_climate" }
terra_game = { path = "crates/terra_game" }
terra_core = { path = "crates/terra_core" }
terra_gen = { path = "crates/terra_gen" }
terra_items = { path = "crates/terra_items" }
terra_land = { path = "crates/terra_land" }
terra_sim = { path = "crates/terra_sim" }
terra_town = { path = "crates/terra_town" }
terra_voxel = { path = "crates/terra_voxel" }
terra_world = { path = "crates/terra_world" }
# The same version Bevy 0.20 uses, so vectors pass between our crates and Bevy unchanged.
# `libm` routes its trigonometry through the portable maths library (D30).
glam = { version = "0.33", features = ["libm"] }
# Pinned by policy (D31): upgrade once the crates we depend on support the new release.
# `jpeg`: models made with Tripo carry JPEG textures.
bevy = { version = "0.20", features = ["free_camera", "bevy_dev_tools", "file_watcher", "jpeg"] }
# No release of the inspector supports Bevy 0.20 yet (0.37 is for 0.19), so this is the
# open pull request that ports it (jakobhellermann/bevy-inspector-egui#324), pinned to an
# exact commit. Return to a crates.io release as soon as one supports Bevy 0.20 (D31).
bevy-inspector-egui = { git = "https://github.com/taboky-dev/bevy-inspector-egui", rev = "9a5b0866ec764ab9baec0f1361f4edac2ea0e764" }
libm = "0.2"
# Already built for Bevy; used to save worlds and, later, to send operations (D21).
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# Smooth voxel meshing with seams between detail levels (D32). Apache-2.0, maintained,
# and already proved in the toolchain spike (research/rust-stack-spike.md).
transvoxel = "2.0"
# PNG pictures written by tools without the engine (the field maps). The version Bevy's image
# loading already builds.
png = "0.18"
# JPEG decoding for the kit checker's look at a material's maps (terra_build::packs, D349),
# the version Bevy's image loading already builds, with its core types.
zune-jpeg = "0.5"
zune-core = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Shared state must compute the same on every platform; see clippy.toml and D30.
disallowed_methods = "deny"

# Dependencies are optimised even in debug builds, so the engine is fast while our own
# code still compiles quickly.
[profile.dev]
opt-level = 1
# Full debug information makes a Windows build over 2 GB, which Windows refuses to load.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The generation and contract crates are small and arithmetic-heavy; unoptimised they make
# anything built on them slow to start.
[profile.dev.package.terra_gen]
opt-level = 3

[profile.dev.package.terra_core]
opt-level = 3

[profile.dev.package.terra_climate]
opt-level = 3

# Building's tests sweep every kit, base and edit: optimised, the key sweep runs in 76 s, not
# 152 s, and the roof and face sweeps in 27 s and 9 s, for 20 to 40 s more on a whole rebuild
# of the crate; a small edit compiles in the same few seconds either way (D406).
[profile.dev.package.terra_build]
opt-level = 3

# A town laid whole, and a day lived in it, are sweeps of the same kind (D406); a
# workspace member is not covered by `package."*"`.
[profile.dev.package.terra_town]
opt-level = 3

# The scenes' checks sweep every scene of the registry, as building's do.
[profile.dev.package.terra_build_scenes]
opt-level = 3

# Our own crates build incrementally in release too: every shot, film, look and the artifacts
# and fuzz ratchets build `--release`, and an edit to terra_build rebuilt it and every crate
# above it from nothing at opt 3, 12 minutes on the loaded machine. Dependencies stay
# non-incremental, as the seed builds them. `cargo xtask bench` builds the `bench` profile,
# which shares the dependencies and builds ours whole, as a player's build is (D408).
[profile.release]
incremental = true

[profile.release.package."*"]
incremental = false

[profile.bench]
incremental = false
