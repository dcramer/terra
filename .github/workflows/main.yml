name: main

# The full check on main a few times a day (D37): `cargo xtask check --all` on Linux, with no GPU
# or Blender (the stages that need them skip and say why). The pre-push hook runs only the fast
# check, so this is where the dependents' tests, the slow tests, the kits, foliage, artifacts and
# fuzz run. A failure opens, or comments on, the issue "main fails the full check"; the next
# passing run closes it. Nothing is bisected or reverted. By hand: the Actions tab, or
# `gh workflow run main.yml`.
on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

# One run at a time; a run started while one runs waits, and a newer one replaces it.
concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # A cold build and the check take about an hour.
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: main fails the full check
    steps:
      - uses: actions/checkout@v4
      # A debug and a release build of the workspace outgrow the runner's free disk.
      - name: Make room on the disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install the libraries Bevy needs on Linux
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Installs the compiler pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # v1: dependencies built optimised, as developers build them; the v0 cache held them
      # unoptimised, and unoptimised Bevy overflowed gltf_gate's 256 KiB IO stacks.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-on-failure: true
      # The check runs the TypeScript tools' tests too; 22 is the oldest line they support.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The full check
        shell: bash
        run: |
          set -o pipefail
          cargo xtask check --all 2>&1 | tee "$RUNNER_TEMP/check.log"
      # Each stage's whole output, which the run's log leaves out (D388).
      - name: Keep the check's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: target/check/*.log
          if-no-files-found: ignore
      - name: Say what broke
        if: failure()
        shell: bash
        env:
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(grep -m1 '^✗ ' "$RUNNER_TEMP/check.log" 2>/dev/null || true)
          rerun=$(grep -m1 'run it alone:' "$RUNNER_TEMP/check.log" 2>/dev/null | sed 's/^ *//' || true)
          {
            echo "The full check fails on $GITHUB_REF_NAME at $GITHUB_SHA."
            echo
            [ -n "$failed" ] && echo "- \`$failed\`"
            [ -n "$rerun" ] && echo "- $rerun"
            echo "- run: $RUN (the stages' logs are its artifact check-logs)"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE\"" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE" --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Close the issue once main passes
        if: success()
        shell: bash
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE\"" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "The full check passes on main at $GITHUB_SHA."
          fi
