name: Deploy token stats

# Deploys the token stats worker (tools/token-stats) to Cloudflare when it changes on
# main. It needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable;
# see tools/token-stats/README.md.

on:
  push:
    branches: [main]
    paths:
      - "tools/token-stats/**"
      - ".github/workflows/token-stats.yml"
  workflow_dispatch:

# One deploy at a time, and the newest wins.
concurrency:
  group: token-stats-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Forks have no Cloudflare account to deploy to.
    if: github.repository == 'dcramer/terra'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/token-stats/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/token-stats/worker/package-lock.json
      - run: node --test ../report.test.mjs src/prices.test.mjs
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
