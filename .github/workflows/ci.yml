name: CI

# By hand (D37): the full check on Linux, macOS and Windows, started from the Actions tab. The
# scheduled full check on main is main.yml, on Linux alone.
on:
  workflow_dispatch:

# A newer push replaces an older run on a pull request. On main every run finishes, so
# that each platform gets to save its build cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the libraries Bevy needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Installs the compiler pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The check runs the TypeScript tools' tests too; 22 is the oldest line they support.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo xtask check --all

  windows:
    # The check job runs natively on Windows; this covers the toolchain we cross-compile
    # with from WSL.
    name: cross-compiles for Windows from Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target x86_64-pc-windows-gnu
