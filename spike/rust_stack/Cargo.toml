[package]
name = "rust_stack_spike"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.19"
transvoxel = "2"
libm = "0.2"

# Optimise dependencies even in debug builds, so the engine is fast while our own code
# still compiles quickly.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
# Full debug info makes the Windows build over 2 GB, which Windows refuses to load.
debug = "line-tables-only"
