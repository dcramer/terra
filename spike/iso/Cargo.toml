[package]
name = "iso"
version = "0.1.0"
edition = "2024"
publish = false

# A throwaway spike (spike/README.md): its own workspace, outside the game's.
[workspace]

[dependencies]
bevy = { version = "0.20", features = ["jpeg", "experimental_pbr_pcss"] }
terra_core = { path = "../../crates/terra_core" }
# The shared hash (an idle's phase from where an actor stands); already built through terra_core.
terra_gen = { path = "../../crates/terra_gen" }
# The biome kit's files (src/kit/, D634): RON through serde, both already in the lock
# through Bevy, at its versions.
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

# The same Bevy changes the game carries (patches/README.md).
[patch.crates-io]
bevy_mesh = { path = "../../patches/bevy_mesh" }
bevy_gltf = { path = "../../patches/bevy_gltf" }
bevy_pbr = { path = "../../patches/bevy_pbr" }
bevy_render = { path = "../../patches/bevy_render" }
bevy_anti_alias = { path = "../../patches/bevy_anti_alias" }

[profile.dev]
debug = "line-tables-only"
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
debug = false
